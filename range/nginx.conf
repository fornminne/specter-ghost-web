worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {}

http {
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;

  server {
    listen 8080;
    location /demo/ {
      proxy_pass http://demo-target:8080/;
      proxy_set_header Host $host;
      proxy_set_header X-Range SPECTER.GHOST;
    }
  }
}
