services:
  range-gateway:
    image: nginx:1.27-alpine
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - range
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  demo-target:
    build: ./targets/demo
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - range
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  range:
    internal: true
