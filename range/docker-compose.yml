# Reference stack only. It does not mount the Docker socket and it does not run the controller.
services:
  range-gateway:
    image: nginx:1.27-alpine
    # Official nginx image user. Non-root avoids the entrypoint chown that CAP_CHOWN would otherwise require.
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101,mode=1777
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /var/run:uid=101,gid=101,mode=0755
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      demo-target:
        condition: service_healthy
    networks:
      - range
      - publish
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL

  demo-target:
    build: ./targets/demo
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - range
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL

networks:
  range:
    internal: true
  # Published ports are not attached to internal networks. This bridge has masquerade
  # disabled and is used only by the gateway, so the demo target stays off the host path.
  publish:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.enable_icc: "false"
