name: Check portal
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:challenges
      - run: npm run check:publish
      - run: npx tsc --noEmit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Controller auth checks
        working-directory: range/controller
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt httpx
          python -m unittest test_auth.py
